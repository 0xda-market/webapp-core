name: Deploy development via infra
run-name: Deploy Market WebApp ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional caller correlation ID
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: market-webapp-development-deploy
  cancel-in-progress: false

jobs:
  package:
    name: Require exact-head Full CI and publish immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Require master and successful push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/master || {
            echo "::error::Development deployment only accepts master." >&2
            exit 1
          }
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha
              and .head_branch == "master"
              and .path == ".github/workflows/ci.yml"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success")] | length > 0
          ' <<<"$runs" >/dev/null || {
            echo "::error::Exact master SHA must pass push-triggered Full CI." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/0xda-market/webapp-core:development-${{ github.sha }}

      - name: Export immutable image digest
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=ghcr.io/0xda-market/webapp-core@$DIGEST" >> "$GITHUB_OUTPUT"

  activate:
    name: Activate via infra and verify completion
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    env:
      INFRA_REPOSITORY: aiaiaiai-org/infra
      WORKLOAD: market-webapp-development
      IMAGE_REF: ${{ needs.package.outputs.image }}
      GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
    steps:
      - name: Dispatch immutable image to infra
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing INFRA_DEPLOY_TOKEN"; exit 1; }
          [[ "$IMAGE_REF" =~ ^ghcr[.]io/0xda-market/webapp-core@sha256:[0-9a-f]{64}$ ]]
          runs_endpoint="repos/$INFRA_REPOSITORY/actions/workflows/deploy-workload.yml/runs"
          baseline="$(gh api --method GET "$runs_endpoint?event=repository_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"
          [[ "$baseline" =~ ^[0-9]+$ ]]
          echo "BASELINE_RUN_ID=$baseline" >> "$GITHUB_ENV"
          jq -nc --arg workload "$WORKLOAD" --arg image "$IMAGE_REF" --arg request_id "$GITHUB_RUN_ID"             '{event_type: "deploy-workload", client_payload: {workload: $workload, image: $image, request_id: $request_id}}' |
            gh api --method POST "repos/$INFRA_REPOSITORY/dispatches" --input -

      - name: Await infra activation and health
        run: |
          set -Eeuo pipefail
          runs_endpoint="repos/$INFRA_REPOSITORY/actions/workflows/deploy-workload.yml/runs"
          title="Deploy $WORKLOAD / $GITHUB_RUN_ID"
          for attempt in $(seq 1 90); do
            response="$(gh api --method GET "$runs_endpoint?event=repository_dispatch&per_page=100")"
            match="$(jq -c --arg title "$title" --argjson baseline "$BASELINE_RUN_ID" '
              [.workflow_runs[] | select(.id > $baseline
                and .display_title == $title
                and .head_branch == "master")] | sort_by(.id) | last // empty
            ' <<<"$response")"
            if [[ -n "$match" ]]; then
              id="$(jq -r .id <<<"$match")"
              status="$(jq -r .status <<<"$match")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$match")"
              if [[ "$status" == completed ]]; then
                echo "Infra run: https://github.com/$INFRA_REPOSITORY/actions/runs/$id" >> "$GITHUB_STEP_SUMMARY"
                [[ "$conclusion" == success ]] || {
                  echo "::error::Infra deployment failed ($id)." >&2
                  exit 1
                }
                echo "Immutable image: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Infra deployment timed out." >&2
          exit 1
