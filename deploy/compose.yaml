services:
  web-app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      nilx-edge:
        aliases:
          - market-web-app
    expose:
      - "1703"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1703/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  nilx-edge:
    external: true
    name: nilx-edge
